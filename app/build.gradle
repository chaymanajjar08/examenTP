plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
}
def secrets = new Properties()
def secretFile = rootProject.file('secrets.properties')
if (secretFile.isFile()) secretFile.withInputStream { secrets.load(it) }
android {
 namespace 'fr.tp.contactsv4'
 compileSdk 35
 defaultConfig {
  applicationId 'fr.tp.contactsv4'
  minSdk 23
  targetSdk 34
  versionCode 2
  versionName '4.0'
  manifestPlaceholders = [mapsKey: secrets.getProperty('MAPS_API_KEY', 'NON_CONFIGUREE').trim()]
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies {
 implementation 'androidx.fragment:fragment-ktx:1.6.0'
 implementation 'androidx.recyclerview:recyclerview:1.1.0'
 implementation 'com.google.android.gms:play-services-maps:19.2.0'

 implementation 'androidx.preference:preference-ktx:1.2.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
}
